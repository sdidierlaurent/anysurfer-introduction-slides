name: Deploy to IONOS

on:
  push:
    branches: [release, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Validate deployment configuration
        env:
          FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.IONOS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.IONOS_FTP_SERVER_DIR }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment setting: $name (see README.md)"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::IONOS_FTP_SERVER_DIR must end with /"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.IONOS_FTP_SERVER }}
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          protocol: ${{ vars.IONOS_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.IONOS_FTP_PORT || '21' }}
          local-dir: ./dist/
          server-dir: ${{ vars.IONOS_FTP_SERVER_DIR }}
