name: Deploy to IONOS

on:
  push:
    branches: [release, 'release/**', 'projet/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/projet/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Validate deployment configuration
        env:
          FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.IONOS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.IONOS_FTP_SERVER_DIR }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment setting: $name (see README.md)"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::IONOS_FTP_SERVER_DIR must end with /"
            exit 1
          fi

      - name: Resolve deployment paths
        id: paths
        env:
          FTP_SERVER_DIR: ${{ vars.IONOS_FTP_SERVER_DIR }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == projet/* ]]; then
            project="${GITHUB_REF_NAME#projet/}"
            if [[ ! "$project" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]]; then
              echo "::error::Project name must contain only letters, digits, hyphens or underscores and start with a letter or digit"
              exit 1
            fi
            FTP_SERVER_DIR="${FTP_SERVER_DIR}${project}/"
            BASE_PATH="${BASE_PATH%/}/${project}/"
          fi
          printf 'server_dir=%s\nbase_path=%s\n' "$FTP_SERVER_DIR" "$BASE_PATH" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ steps.paths.outputs.base_path }}

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy via SFTP
        timeout-minutes: 15
        env:
          SFTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.IONOS_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
          SFTP_PORT: ${{ vars.IONOS_FTP_PORT || '22' }}
          SFTP_SERVER_DIR: ${{ steps.paths.outputs.server_dir }}
        shell: python
        run: |
          import os
          import subprocess
          from urllib.parse import quote

          def lftp_quote(value):
              if any(char in value for char in "\r\n\0"):
                  raise ValueError("Invalid control character in deployment setting")
              return '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('$', '\\$').replace('`', '\\`') + '"'

          host = os.environ["SFTP_SERVER"]
          if not host or any(c not in "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-" for c in host):
              raise ValueError("IONOS_FTP_SERVER must be a hostname without protocol or path")
          port = int(os.environ["SFTP_PORT"])
          if not 1 <= port <= 65535:
              raise ValueError("Invalid SFTP port")
          username = quote(os.environ["SFTP_USERNAME"], safe="")
          destination = lftp_quote(os.environ["SFTP_SERVER_DIR"])
          commands = f"""
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 2
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=accept-new"
          open --env-password sftp://{username}@{host}:{port}
          mkdir -p {destination}
          mirror --reverse --verbose --no-perms ./dist/ {destination}
          bye
          """
          subprocess.run(["lftp", "--norc"], input=commands, text=True, check=True)
